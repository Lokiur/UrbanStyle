<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Admin Panel</title>

        <!-- TU CSS PRINCIPAL -->
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        />

        <!-- CSS EXTRA CRUD -->
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/admin.css') }}"
        />
    </head>

    <body>
        <header class="navbar">
            <div class="logo">UrbanStyle Admin</div>

            <nav>
                <a href="{{ url_for('index') }}">Tienda</a>
                <a href="{{ url_for('admin_panel') }}">Admin</a>
                <a href="{{ url_for('logout') }}">Salir</a>
            </nav>
        </header>

        <section class="hero" style="flex-direction: column">
            <h1>Panel Administrativo</h1>

            <!-- ================= CREAR ================= -->
            <form
                action="{{ url_for('crear_usuario') }}"
                method="POST"
                style="
                    display: grid;
                    grid-template-columns: repeat(3, 1fr);
                    gap: 15px;
                    width: 100%;
                    max-width: 1000px;
                "
            >
                <input name="username" placeholder="Usuario" required />
                <input name="name" placeholder="Nombre" required />
                <input name="apellidos" placeholder="Apellidos" required />

                <input name="usuario_email" placeholder="Email" required />
                <input
                    name="password"
                    placeholder="Contraseña"
                    type="password"
                    required
                />
                <input name="celular" placeholder="Celular" />

                <input type="date" name="fechanaci" />

                <select name="rol">
                    <option value="usuario">Usuario</option>
                    <option value="admin">Admin</option>
                </select>

                <button class="primary-btn" style="grid-column: 1/4">
                    Crear Usuario
                </button>
            </form>

            <!-- ================= TABLA ================= -->
            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Usuario</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Rol</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>
                        {% for u in users %}
                        <tr>
                            <td>{{ u.id }}</td>
                            <td>{{ u.username }}</td>
                            <td>{{ u.name }} {{ u.apellidos }}</td>
                            <td>{{ u.email }}</td>
                            <td>{{ u.rol }}</td>

                            <td>
                                <div class="action-btns">
                                    <button
                                        class="secondary-btn"
                                        onclick="openModal({{ u.id }})"
                                    >
                                        Editar
                                    </button>

                                    <a
                                        href="{{ url_for('delete', id=u.id) }}"
                                        style="color: #ff4d4d"
                                    >
                                        Eliminar
                                    </a>
                                </div>
                            </td>
                        </tr>

                        <!-- ================= MODAL ================= -->
                        <div class="modal" id="modal-{{ u.id }}">
                            <div class="modal-content">
                                <h3>Editar Usuario</h3>

                                <form
                                    action="{{ url_for('edit', id=u.id) }}"
                                    method="POST"
                                >
                                    <input
                                        name="username"
                                        value="{{ u.username }}"
                                    />
                                    <input name="name" value="{{ u.name }}" />
                                    <input
                                        name="apellidos"
                                        value="{{ u.apellidos }}"
                                    />
                                    <input
                                        name="usuario_email"
                                        value="{{ u.email }}"
                                    />
                                    <input
                                        name="password"
                                        value="{{ u.password }}"
                                    />
                                    <input
                                        name="celular"
                                        value="{{ u.celular }}"
                                    />
                                    <input
                                        type="date"
                                        name="fechanaci"
                                        value="{{ u.fechanaci }}"
                                    />

                                    <select name="rol">
                                        {% if u.rol == 'admin' %}
                                        <option value="admin" selected>
                                            Admin
                                        </option>
                                        <option value="usuario">Usuario</option>
                                        {% else %}
                                        <option value="usuario" selected>
                                            Usuario
                                        </option>
                                        <option value="admin">Admin</option>
                                        {% endif %}
                                    </select>

                                    <button class="primary-btn">Guardar</button>
                                </form>

                                <button
                                    class="secondary-btn"
                                    onclick="closeModal({{ u.id }})"
                                >
                                    Cerrar
                                </button>
                            </div>
                        </div>

                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </section>

        <!-- JS EXTERNO -->
        <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
    </body>
</html>
