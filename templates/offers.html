<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Ofertas | UrbanStyle</title>

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
  >

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/offers.css') }}"
  >

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/footer.css') }}"
  >

  <!-- FONT AWESOME -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

</head>

<body>

  <!-- NAVBAR -->

  <header class="navbar">

    <div class="logo">

      <i class="fa-solid fa-bolt"></i>

      <span>UrbanStyle</span>

    </div>

    <nav>

      <a href="{{ url_for('index') }}">
        Tienda
      </a>

      <a href="{{ url_for('categories') }}">
        Categorías
      </a>

      <a href="{{ url_for('products') }}">
        Nuevo
      </a>

      <a href="{{ url_for('offers') }}">
        Ofertas
      </a>

      <a href="{{ url_for('about') }}">
        Sobre Nosotros
      </a>

      <a href="{{ url_for('login') }}">
        Login
      </a>

    </nav>

  </header>

  <!-- OFFERS -->

  <section class="offers">

    <div class="offers-content">

      <span>OFERTA LIMITADA</span>

      <h2>
        30% OFF En La Nueva Colección
      </h2>

      <p>
        Aprovecha descuentos exclusivos por tiempo limitado
        y renueva tu estilo con nuestras prendas premium.
      </p>

      <button>
        Comprar ahora
      </button>

    </div>

    <div class="offers-image">

      <img
        src="{{ url_for('static', filename='img/oferta.png') }}"
        alt="Oferta UrbanStyle"
      >

    </div>

  </section>

  <!-- FOOTER -->

  {% include 'footer.html' %}

</body>

</html>
