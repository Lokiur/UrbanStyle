<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Login UrbanStyle</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}?v=1">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">

    <!-- Favicon -->
    <link rel="shortcut icon"
          href="{{ url_for('static', filename='assets/imgs/logose.png') }}"
          type="image/x-icon">

</head>

<body>

    <div class="form">

        <!-- LOGO -->
        <div class="logo">

            <a href="./">

                <img src="{{ url_for('static', filename='assets/imgs/logo.png') }}"
                     alt="Logo">

            </a>

        </div>

        <!-- TITULO -->
        <h2>Login UrbanStyle</h2>

        <!-- FORMULARIO -->
        <form action="/login" method="POST">

            <div class="input">

                <!-- USUARIO -->
                <div class="inputBox">

                    <label for="username">
                        Usuario
                    </label>

                    <input type="text"
                           id="username"
                           name="username"
                           placeholder="Ingrese su usuario"
                           required>

                </div>

                <!-- PASSWORD -->
                <div class="inputBox">

                    <label for="password">
                        Contraseña
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           placeholder="Ingrese su contraseña"
                           required>

                </div>

                <!-- BOTON -->
                <div class="inputBox">

                    <input type="submit"
                           value="Iniciar Sesión">

                </div>

            </div>

        </form>

        <!-- MENSAJE -->
        {% if message %}

        <div class="error-message">
            {{ message }}
        </div>

        {% endif %}

        <!-- RECUPERAR -->
        <p class="forgot">

            ¿Olvidaste tu contraseña?

            <a href="#">
                Click Aquí
            </a>

        </p>

        <!-- LOGOUT -->
        <div class="logout">

            <a href="{{ url_for('logout') }}">

                <i class="bi bi-arrow-clockwise"></i>

                Salir

            </a>

        </div>

    </div>

    <!-- JS -->
    <script src="{{ url_for('static', filename='assets/js/jquery-3.6.0.js') }}"></script>

    <script src="{{ url_for('static', filename='assets/js/menu.js') }}"></script>

    <script src="{{ url_for('static', filename='assets/js/pace.min.js') }}"></script>

    <script src="{{ url_for('static', filename='assets/js/custom_alert.js') }}"></script>

    <script src="{{ url_for('static', filename='assets/js/scripts.js') }}"></script>

</body>

</html>
