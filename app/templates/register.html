<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Registro | UrbanStyle</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/variables.css') }}"
  >

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/login.css') }}"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css"
  />

  <!-- Favicon -->
  <link
    rel="shortcut icon"
    href="{{ url_for('static', filename='img/urbanstyle.png') }}"
    type="image/x-icon"
  />

</head>

<body>

  <div class="form">

    <!-- TITULO -->

    <h2>Crear Cuenta</h2>

    <!-- FORMULARIO -->

    <form method="POST">

      <div class="input">

        <!-- USUARIO -->

        <div class="inputBox">

          <label><i class="bi bi-person-fill"></i> Usuario</label>

          <input
            type="text"
            name="username"
            placeholder="Ingrese un usuario"
            required
          >

        </div>

        <!-- NOMBRE -->

        <div class="inputBox">

          <label><i class="bi bi-card-text"></i> Nombre</label>

          <input
            type="text"
            name="name"
            placeholder="Ingrese su nombre"
            required
          >

        </div>

        <!-- DOCUMENTO DE IDENTIDAD -->

        <div class="inputBox">

          <label><i class="bi bi-credit-card-2-front-fill"></i> Documento de identidad</label>

          <input
            type="text"
            name="documento_identidad"
            placeholder="Ingrese su documento de identidad"
            required
          >

        </div>

        <!-- EMAIL -->

        <div class="inputBox">

          <label><i class="bi bi-envelope-fill"></i> Correo</label>

          <input
            type="email"
            name="email"
            placeholder="Ingrese su correo"
            required
          >

        </div>

        <!-- PASSWORD -->

        <div class="inputBox">

          <label><i class="bi bi-lock-fill"></i> Contraseña</label>

          <input
            type="password"
            name="password"
            placeholder="Ingrese una contraseña"
            required
          >

        </div>

        <!-- CAPTCHA -->

        <div class="inputBox">

          <label><i class="bi bi-calculator-fill"></i> ¿Cuánto es {{ captcha_a }} + {{ captcha_b }}?</label>

          <input
            type="text"
            name="captcha"
            placeholder="Resuelve la suma"
            required
          >

        </div>

        <!-- BOTON -->

        <div class="inputBox">

          <input
            type="submit"
            value="Registrarse"
          >

        </div>

      </div>

    </form>

    <!-- MENSAJE -->

    {% if message %}

    <div class="error-message">

      {{ message }}

    </div>

    {% endif %}

    <!-- LOGIN -->

    <p class="forgot">

      ¿Ya tienes cuenta?

      <a href="{{ url_for('auth.login') }}">
        Iniciar sesión
      </a>

    </p>

  </div>

</body>
</html>
