<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mi Perfil | UrbanStyle</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/variables.css') }}"
  >

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}"
  >

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/admin.css') }}"
  >

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/footer.css') }}"
  >

  <link
    rel="shortcut icon"
    href="{{ url_for('static', filename='img/urbanstyle.png') }}"
    type="image/x-icon"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

</head>

<body>

  {% include 'header.html' %}

  <section class="hero" style="flex-direction: column">

    <h1>Mi Perfil</h1>

    <form
      method="POST"
      style="
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
        width: 100%;
        max-width: 700px;
      "
    >
      <input name="name" value="{{ usuario.name }}" placeholder="Nombre" required>
      <input name="apellidos" value="{{ usuario.apellidos }}" placeholder="Apellidos" required>

      <input name="email" type="email" value="{{ usuario.email }}" placeholder="Correo" required>
      <input name="celular" value="{{ usuario.celular or '' }}" placeholder="Celular">

      <input
        name="nueva_password"
        type="password"
        placeholder="Nueva contraseña (dejar en blanco para no cambiar)"
        style="grid-column: 1/3"
      >

      <button class="primary-btn" style="grid-column: 1/3">Guardar Cambios</button>
    </form>

  </section>

  {% include 'footer.html' %}

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
