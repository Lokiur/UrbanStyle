<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>UrbanStyle</title>

        <!-- CSS -->
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/variables.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/style.css') }}"
        />
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/footer.css') }}"
        />

        <!-- FONT AWESOME -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        />

        <!-- Favicon -->
        <link
            rel="shortcut icon"
            href="{{ url_for('static', filename='img/urbanstyle.png') }}"
            type="image/x-icon"
        />
    </head>

    <body>
        <!-- ================= NAVBAR ================= -->
        {% include 'header.html' %}

        <!-- ================= HERO ================= -->
        <section class="hero">
            <div class="hero-text">
                <div class="badge">⚡ Nueva Colección!</div>

                <h1>
                    Ponte En Tu <br />
                    <span>Mejor Versión</span>
                </h1>

                <p>
                    Ropa de alta calidad diseñada para inspirar confianza y
                    estilo
                </p>

                <div class="buttons">
                    <button class="primary-btn">Compra ahora</button>
                    <button class="secondary-btn">Explorar categorías</button>
                </div>

                <!-- FEATURES -->
                <div class="hero-features">
                    <div class="feature">
                        <i class="fa-solid fa-truck"></i>
                        <div>
                            <h5>Envío gratis</h5>
                            <p>Pedidos mayores a $150.000</p>
                        </div>
                    </div>

                    <div class="feature">
                        <i class="fa-solid fa-shield"></i>
                        <div>
                            <h5>Devolución fácil</h5>
                            <p>Garantía de 60 días</p>
                        </div>
                    </div>

                    <div class="feature">
                        <i class="fa-solid fa-award"></i>
                        <div>
                            <h5>Productos premium</h5>
                            <p>Calidad garantizada</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="hero-image">
                <div class="background-card"></div>

                <img
                    src="{{ url_for('static', filename='img/ropa.png') }}"
                    class="product-image"
                    alt="ropa"
                />
            </div>
        </section>

        <!-- ================= FOOTER ================= -->
        {% include 'footer.html' %}

        <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    </body>
</html>
