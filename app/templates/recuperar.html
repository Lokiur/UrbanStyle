<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />

        <title>Recuperar Contraseña | UrbanStyle</title>

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- CSS -->
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/variables.css') }}"
        >
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='css/login.css') }}"
        >

        <!-- Bootstrap Icons -->
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css"
        />

        <!-- Favicon -->
        <link
            rel="shortcut icon"
            href="{{ url_for('static', filename='img/urbanstyle.png') }}"
            type="image/x-icon"
        />
    </head>

    <body>

        <div class="form">

            <!-- LOGO -->

            <div class="logo">

                <a href="{{ url_for('home.index') }}">

                    <img
                        src="{{ url_for('static', filename='img/urbanstyle.png') }}"
                        alt="Logo"
                    />

                </a>

            </div>

            <!-- TITULO -->

            <h2>Recuperar Contraseña</h2>

            <!-- FORMULARIO -->

            <form action="{{ url_for('auth.recuperar') }}" method="POST">

                <div class="input">

                    <!-- USUARIO -->

                    <div class="inputBox">

                        <label for="username"><i class="bi bi-person-fill"></i> Usuario</label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Ingrese su usuario"
                            required
                        />

                    </div>

                    <!-- DOCUMENTO DE IDENTIDAD -->

                    <div class="inputBox">

                        <label for="documento_identidad"><i class="bi bi-credit-card-2-front-fill"></i> Documento de identidad</label>

                        <input
                            type="text"
                            id="documento_identidad"
                            name="documento_identidad"
                            placeholder="Ingrese su documento de identidad"
                            required
                        />

                    </div>

                    <!-- NUEVA CONTRASEÑA -->

                    <div class="inputBox">

                        <label for="nueva_password"><i class="bi bi-lock-fill"></i> Nueva contraseña</label>

                        <input
                            type="password"
                            id="nueva_password"
                            name="nueva_password"
                            placeholder="Ingrese su nueva contraseña"
                            required
                        />

                    </div>

                    <!-- CAPTCHA -->

                    <div class="inputBox">

                        <label for="captcha"><i class="bi bi-calculator-fill"></i> ¿Cuánto es {{ captcha_a }} + {{ captcha_b }}?</label>

                        <input
                            type="text"
                            id="captcha"
                            name="captcha"
                            placeholder="Resuelve la suma"
                            required
                        />

                    </div>

                    <!-- BOTON -->

                    <div class="inputBox">

                        <input
                            type="submit"
                            value="Actualizar Contraseña"
                        />

                    </div>

                </div>

            </form>

            <!-- MENSAJE -->

            {% if message %}

            <div class="error-message">

                {{ message }}

            </div>

            {% endif %}

            <!-- LOGIN -->

            <p class="forgot">

                ¿Ya recordaste tu contraseña?

                <a href="{{ url_for('auth.login') }}">
                    Iniciar sesión
                </a>

            </p>

        </div>

    </body>
</html>
